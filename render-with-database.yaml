# 仅当 Render 账户还没有任何免费 PostgreSQL 时使用此 Blueprint。
# 若提示 "cannot have more than one active free tier database"，请改用 render.yaml。

services:
  - type: web
    name: xuejia
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && sh scripts/render-db.sh && npm run build
    startCommand: sh scripts/render-start.sh
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: xuejia-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false

databases:
  - name: xuejia-db
    plan: free
    databaseName: xuejia
    user: xuejia
