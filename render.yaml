# Render 免费账户仅允许 1 个免费 PostgreSQL。
# 若已有数据库，请用本文件（只创建 Web 服务），并手动填写 DATABASE_URL。
# 若账户尚无免费库，可使用 render-with-database.yaml 一键创建库+服务。

services:
  - type: web
    name: xuejia
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
